<title>Karate Bunnies 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{color-scheme:dark;--cream:#f8f1e4;--ink:#2a1a12;--green:#334f42;--green-d:#233c30;--pink:#d57b79;--aka:#d02f37;--ao:#2d63c8;--muted:#847b6f;--bg:#1b2233}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--cream);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{font:16px system-ui,-apple-system,"Segoe UI",sans-serif}
#game{position:fixed;inset:0;overflow:hidden}
canvas{display:block;width:100%;height:100%}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;border:0}
button:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.layer{position:absolute;inset:0;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.layer[hidden]{display:none!important}
.layer>*{pointer-events:auto}
/* HUD */
.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start;padding-top:12px}
.side{display:flex;flex-direction:column;gap:6px;min-width:0}
.side.right{align-items:flex-end}
.nameplate{display:flex;align-items:center;gap:8px;font:700 16px Georgia,serif;letter-spacing:.02em;text-shadow:0 2px 0 #0007}
.chip{width:14px;height:14px;border-radius:50%;border:2px solid var(--cream)}
.chip.aka{background:var(--aka)}.chip.ao{background:var(--ao)}
.bar{position:relative;width:100%;max-width:420px;height:18px;border-radius:10px;background:#0b0f19;border:2px solid var(--cream);overflow:hidden;box-shadow:0 3px 0 #0006}
.bar i{position:absolute;inset:0;transform-origin:left;background:linear-gradient(#f3c66a,#e09a3c);transition:transform .12s}
.bar b{position:absolute;inset:0;transform-origin:left;background:#fff5;transition:transform .6s .25s}
.side.right .bar i,.side.right .bar b{transform-origin:right}
.pips{display:flex;gap:6px}
.pip{width:14px;height:14px;border-radius:50%;border:2px solid var(--cream);background:#0005}
.pip.on{background:var(--pink)}
.clock{font:700 30px Georgia,serif;min-width:64px;text-align:center;line-height:1;background:#141a2ae6;border:2px solid var(--cream);border-radius:12px;padding:6px 10px 4px}
.round-tag{font:700 14px system-ui;letter-spacing:.14em;text-transform:uppercase;text-align:center;margin-top:6px;text-shadow:0 2px 3px #000}
.iconbtn{width:44px;height:44px;border-radius:50%;background:#fff1;color:var(--cream);border:2px solid #fff5;font:700 16px system-ui;display:grid;place-items:center}
.top-actions{position:absolute;top:calc(env(safe-area-inset-top,0px) + 74px);right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px}
/* centre call */
.call{position:absolute;left:0;right:0;top:34%;text-align:center;font:700 clamp(44px,9vw,92px)/1 Georgia,serif;color:var(--cream);letter-spacing:-.02em;text-shadow:0 5px 0 var(--ink),0 0 30px #000a;pointer-events:none;transform:scale(.8);opacity:0;transition:transform .25s cubic-bezier(.2,1.6,.4,1),opacity .2s}
.call.show{transform:scale(1);opacity:1}
.call small{display:block;font:700 18px system-ui;letter-spacing:.2em;text-transform:uppercase;margin-top:14px;text-shadow:0 2px 0 var(--ink)}
/* title */
.title{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:14px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 7vh);text-align:center}
.logo{font:700 clamp(46px,9vw,104px)/.92 Georgia,serif;letter-spacing:-.04em;color:var(--cream);text-shadow:0 6px 0 var(--ink),0 0 40px #0009;margin:0}
.logo em{font-style:normal;color:#f3a6a2}
.tag3d{display:inline-block;font:800 16px system-ui;letter-spacing:.18em;background:var(--pink);color:var(--ink);border-radius:8px;padding:6px 12px;vertical-align:middle;margin-left:8px;transform:translateY(-.4em) rotate(-4deg);text-shadow:none}
.sub{font:16px system-ui;color:#f8f1e4d9;max-width:34ch;line-height:1.5;margin:0;text-shadow:0 2px 6px #000c}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.primary{background:var(--green);color:#fff;border-radius:12px;padding:17px 34px;box-shadow:0 5px 0 var(--green-d);font:800 18px system-ui;letter-spacing:.04em}
.primary:active{transform:translateY(3px);box-shadow:0 2px 0 var(--green-d)}
.secondary{background:#fffaf2;color:#3e5145;border-radius:12px;padding:14px 22px;font:700 16px system-ui;box-shadow:0 4px 0 #b9ae97}
.secondary:active{transform:translateY(2px);box-shadow:0 2px 0 #b9ae97}
.keys{font:14px system-ui;color:#f8f1e4c7;text-shadow:0 2px 4px #000}
.keys kbd{font:700 14px system-ui;background:#fff2;border:1px solid #fff5;border-radius:5px;padding:1px 7px;margin:0 1px}
/* touch controls */
.pad{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;gap:12px;align-items:flex-end}
.pad.left{left:max(18px,env(safe-area-inset-left,0px))}
.pad.right{right:max(18px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:repeat(2,auto);gap:12px}
.dir{width:76px;height:76px;border-radius:50%;background:#fff9e6d6;color:var(--ink);font:800 26px system-ui;box-shadow:0 4px 0 #0005}
.act{width:78px;height:78px;border-radius:50%;color:#fff;font:800 15px system-ui;letter-spacing:.02em;box-shadow:0 4px 0 #0006;border:3px solid #fff8;display:grid;place-items:center;line-height:1.05}
.act span{display:block;font:700 14px system-ui;opacity:.85}
.act.punch{background:#d0663b}.act.kick{background:#3c8a5b}.act.round{background:#8a4bb0}.act.spin{background:#2c6fb3}
.dir.held,.act.held{transform:scale(.93);filter:brightness(1.15)}
/* menu sheets (in-scene, no blur panels) */
.menu{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;text-align:center;background:linear-gradient(#1b223300,#1b2233c0 40%,#1b2233c0 60%,#1b223300)}
.menu h2{font:700 clamp(36px,7vw,64px)/1 Georgia,serif;margin:0;text-shadow:0 5px 0 var(--ink)}
.menu p{margin:0;font:16px system-ui;color:#f8f1e4d9}
.loading{display:grid;place-items:center;font:700 22px Georgia,serif;background:var(--bg)}
.loading span{display:block;font:16px system-ui;color:#f8f1e4b3;margin-top:8px;text-align:center}
.hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);text-align:center;pointer-events:none}
@media (pointer:coarse){.keys{display:none}}
@media (pointer:fine){.pad{display:none}}
@media (max-width:560px){.bar{height:14px}.clock{font-size:28px;min-width:48px}.nameplate{font-size:15px}.dir{width:66px;height:66px}.act{width:68px;height:68px;font-size:14px}.act span{display:none}}
@media (orientation:landscape) and (max-height:500px){.hud{padding-top:6px}.top-actions{top:calc(env(safe-area-inset-top,0px) + 58px)}.dir{width:62px;height:62px}.act{width:62px;height:62px}.pad.right{gap:8px}.title{padding-bottom:16px;gap:10px}.logo{font-size:52px}}
</style>

<div id="game">
  <canvas id="c" aria-label="Karate Bunnies 3D arena"></canvas>

  <div class="layer hud-layer" id="hud" hidden>
    <div class="hud">
      <div class="side">
        <div class="nameplate"><span class="chip aka"></span><span id="n1">You · Aka</span></div>
        <div class="bar" id="bar1"><b></b><i></i></div>
        <div class="pips" id="pips1"><span class="pip"></span><span class="pip"></span></div>
      </div>
      <div><div class="clock" id="clock">60</div><div class="round-tag" id="roundTag">Round 1</div></div>
      <div class="side right">
        <div class="nameplate"><span id="n2">Ao · CPU</span><span class="chip ao"></span></div>
        <div class="bar" id="bar2"><b></b><i></i></div>
        <div class="pips" id="pips2"><span class="pip"></span><span class="pip"></span></div>
      </div>
    </div>
    <div class="top-actions">
      <button class="iconbtn" id="camBtn" aria-label="Change camera" title="">📷</button>
      <button class="iconbtn" id="pauseBtn" aria-label="Pause">II</button>
    </div>
    <div class="call" id="call"></div>
    <div class="pad left" id="padL">
      <button class="dir" data-dir="-1" aria-label="Move back">◀</button>
      <button class="dir" data-dir="1" aria-label="Move forward">▶</button>
    </div>
    <div class="pad right" id="padR">
      <button class="act punch" data-move="punch">Punch<span>J</span></button>
      <button class="act kick" data-move="kick">Kick<span>K</span></button>
      <button class="act round" data-move="round">Round<span>L</span></button>
      <button class="act spin" data-move="spin">Spin<span>I</span></button>
    </div>
  </div>

  <div class="layer title" id="title" hidden>
    <h1 class="logo">Karate<br><em>Bunnies</em><span class="tag3d">3D</span></h1>
    <p class="sub">Red belt against blue. Same bunnies, same moves, now in a real 3D dojo.</p>
    <div class="row"><button class="primary" id="startBtn">Fight!</button><button class="secondary" id="titleCam">Camera: Side</button></div>
    <div class="keys"><kbd>A</kbd><kbd>D</kbd> move · <kbd>J</kbd> punch (tap twice) · <kbd>K</kbd> kick · <kbd>L</kbd> roundhouse combo · <kbd>I</kbd> spinning back kick · hold back to block</div>
  </div>

  <div class="layer menu" id="pause" hidden>
    <h2>Paused</h2>
    <div class="row"><button class="primary" id="resumeBtn">Resume</button><button class="secondary" id="restartBtn">Restart</button><button class="secondary" id="quitBtn">Title</button></div>
  </div>

  <div class="layer menu" id="result" hidden style="background:none;justify-content:flex-end;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 9vh)">
    <div class="row"><button class="primary" id="againBtn">Rematch</button><button class="secondary" id="toTitleBtn">Title</button></div>
  </div>

  <div class="layer loading" id="loading"><div>Warming up the dojo…<span id="loadMsg">loading bunnies</span></div></div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OutlineEffect } from 'three/addons/effects/OutlineEffect.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

// ---------------------------------------------------------------- data from the Blender bake (export3d.py / moves.json)
const FPS = 30;
const RAMPS = {   // toon ramps from the Blender materials (linear rgb): [shadow, lit, highlight]
  gi:   [[.552,.578,.644],[.905,.896,.855],[1,1,1]],
  fur:  [[.745,.527,.407],[.939,.799,.687],[1,.922,.855]],
  pink: [[.784,.242,.198],[.93,.376,.305]],
  nose: [[.694,.162,.159],[.871,.275,.275]],
  eye:  [[.018,.006,.003],[.042,.012,.005]],
  iris: [[.147,.036,.01],[.254,.068,.018]],
};
const FLAT = { blush:[.947,.552,.509], inkline:[.068,.032,.019], shine:[1,1,1] };
const TEAM = {   // belt, headband and pads: the only parts that change colour
  aka: [[.328,.014,.02],[.631,.028,.038]],
  ao:  [[.014,.069,.305],[.026,.125,.578]],
};
const INK = [.102,.043,.022];
const NO_OUTLINE = new Set(['eye','iris','shine','blush','inkline','nose','pink']);
// moves: clip ranges in Blender frames, hit frames (absolute), the limb that strikes, damage, lead switch at the end
const MOVES = {
  punch: { clip:'mawashi', range:[0,16], cut:11, chainBy:10, hits:[{f:6,limb:'fingers_aL',dmg:5},{f:13,limb:'fingers_aR',dmg:7,chained:true}], lead:false },
  kick:  { clip:'kick',    range:[0,25], hits:[{f:12,limb:'toeR',dmg:12}], lead:true },
  round: { clip:'mawashi', range:[0,34], hits:[{f:6,limb:'fingers_aL',dmg:4},{f:13,limb:'fingers_aR',dmg:5},{f:22,limb:'toeR',dmg:13}], lead:true },
  spin:  { clip:'ushiro',  range:[0,37], hits:[{f:10,limb:'toeL',dmg:6},{f:24,limb:'toeR',dmg:13}], lead:true },
};
const BASIC = { idle:['idle',48,96,true], advance:['advance',20,36,true], hit:['hit',0,15,false], ko:['ko',0,44,false], koLoop:['ko',20,36,true], win:['win',0,24,false], winLoop:['win',12,24,true] };

// ---------------------------------------------------------------- renderer, scene, arena
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const effect = new OutlineEffect(renderer, { defaultThickness: 0.0042, defaultColor: INK, defaultAlpha: 1 });
const scene = new THREE.Scene();
scene.background = new THREE.Color().setRGB(.012, .018, .04);
scene.fog = new THREE.Fog(scene.background, 16, 34);
const camera = new THREE.PerspectiveCamera(30, 1, .1, 80);

const sun = new THREE.DirectionalLight(0xffffff, Math.PI * .86);
sun.position.set(-3.5, 9, 6.5); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, { left: -7, right: 7, top: 6, bottom: -3, near: 1, far: 30 });
sun.shadow.bias = -.0006; sun.shadow.normalBias = .02;
scene.add(sun, sun.target);
scene.add(new THREE.AmbientLight(0xffffff, Math.PI * .16));

function lin(c) { return new THREE.Color().setRGB(c[0], c[1], c[2]); }
function canvasTex(w, h, draw) { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; draw(cv.getContext('2d'), w, h); const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; }

function buildArena() {
  const g = new THREE.Group();
  // floor: dark surround, blue competition mat with a red safety border and the two start lines
  const floorTex = canvasTex(2048, 1024, (x, w, h) => {
    x.fillStyle = '#2a3348'; x.fillRect(0, 0, w, h);
    const mx = w * .12, my = h * .18, mw = w * .76, mh = h * .64;
    x.fillStyle = '#c8333b'; x.fillRect(mx - 26, my - 26, mw + 52, mh + 52);
    x.fillStyle = '#2f6fd0'; x.fillRect(mx, my, mw, mh);
    x.globalAlpha = .10; x.strokeStyle = '#0b1f45'; x.lineWidth = 3;   // tatami seams
    for (let i = 1; i < 8; i++) { x.beginPath(); x.moveTo(mx + mw * i / 8, my); x.lineTo(mx + mw * i / 8, my + mh); x.stroke(); }
    for (let i = 1; i < 4; i++) { x.beginPath(); x.moveTo(mx, my + mh * i / 4); x.lineTo(mx + mw, my + mh * i / 4); x.stroke(); }
    x.globalAlpha = .85; x.fillStyle = '#f4f1e6';
    x.fillRect(w / 2 - 150, h / 2 - 40, 10, 80); x.fillRect(w / 2 + 140, h / 2 - 40, 10, 80);
    x.globalAlpha = 1;
  });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(24, 12), new THREE.MeshLambertMaterial({ map: floorTex }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; g.add(floor);
  // back wall with the dojo's red and blue bands and a banner
  const wallTex = canvasTex(2048, 512, (x, w, h) => {
    const gr = x.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#141a2a'); gr.addColorStop(1, '#232c42');
    x.fillStyle = gr; x.fillRect(0, 0, w, h);
    x.fillStyle = '#b7202f'; x.fillRect(0, h * .62, w, h * .07);
    x.fillStyle = '#1f4fa0'; x.fillRect(0, h * .69, w, h * .04);
    for (let i = 0; i < 9; i++) { x.fillStyle = i % 2 ? '#1a2235' : '#1d2639'; x.fillRect(i * w / 9, 0, 6, h * .62); }
  });
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(40, 10), new THREE.MeshBasicMaterial({ map: wallTex }));
  wall.position.set(0, 5, -6); g.add(wall);
  const banTex = canvasTex(1024, 256, (x, w, h) => {
    x.fillStyle = '#f8f1e4'; x.fillRect(0, 0, w, h);
    x.fillStyle = '#c8333b'; x.fillRect(0, 0, w, 18); x.fillRect(0, h - 18, w, 18);
    x.fillStyle = '#2a1a12'; x.font = '700 120px Georgia, serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText('KARATE BUNNIES', w / 2, h / 2 + 6);
  });
  const banner = new THREE.Mesh(new THREE.PlaneGeometry(7, 1.75), new THREE.MeshBasicMaterial({ map: banTex }));
  banner.position.set(0, 4.6, -5.95); g.add(banner);
  for (const sx of [-1, 1]) {   // red and blue corner flags
    const f = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 2.4), new THREE.MeshBasicMaterial({ color: sx < 0 ? 0xc8333b : 0x2d63c8 }));
    f.position.set(sx * 6.2, 4.3, -5.94); g.add(f);
  }
  scene.add(g);
}
buildArena();

// drifting petals: the dojo is alive between rounds
const petals = (() => {
  const n = 46, geo = new THREE.BufferGeometry(), pos = new Float32Array(n * 3), seed = [];
  for (let i = 0; i < n; i++) { pos.set([(Math.random() - .5) * 18, Math.random() * 7, -5 + Math.random() * 8], i * 3); seed.push(Math.random() * 10); }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const tex = canvasTex(64, 64, (x) => { x.fillStyle = '#f6b8bf'; x.beginPath(); x.ellipse(32, 32, 26, 15, .6, 0, 7); x.fill(); });
  const p = new THREE.Points(geo, new THREE.PointsMaterial({ size: .16, map: tex, transparent: true, depthWrite: false, opacity: .8 }));
  scene.add(p);
  return { update(t, dt) { for (let i = 0; i < n; i++) { let y = pos[i * 3 + 1] - dt * (.35 + .1 * Math.sin(seed[i])); if (y < 0) y = 7; pos[i * 3 + 1] = y; pos[i * 3] += Math.sin(t * .7 + seed[i]) * dt * .25; } geo.attributes.position.needsUpdate = true; } };
})();

// ---------------------------------------------------------------- effects: impact stars, guard sparks, dust, shake
const starTex = canvasTex(256, 256, (x, w) => {
  x.translate(w / 2, w / 2); x.fillStyle = '#fff1d0'; x.strokeStyle = '#2a1a12'; x.lineWidth = 10; x.beginPath();
  for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8, r = i % 2 ? 46 : 118; x.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  x.closePath(); x.stroke(); x.fill();
});
const guardTex = canvasTex(256, 256, (x, w) => {
  x.translate(w / 2, w / 2); x.strokeStyle = '#bfe3ff'; x.lineWidth = 16; x.beginPath(); x.arc(0, 0, 90, -1.2, 1.2); x.stroke();
  x.lineWidth = 8; x.beginPath(); x.arc(0, 0, 112, -.8, .8); x.stroke();
});
const dustTex = canvasTex(128, 128, (x) => { const g = x.createRadialGradient(64, 64, 4, 64, 64, 60); g.addColorStop(0, '#e8eefcdd'); g.addColorStop(1, '#e8eefc00'); x.fillStyle = g; x.fillRect(0, 0, 128, 128); });
const fx = [];
function spawn(tex, at, size, life, opts = {}) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false }));
  s.position.copy(at); s.scale.setScalar(size); s.renderOrder = 10; scene.add(s);
  fx.push({ s, life, t: 0, size, grow: opts.grow ?? 1.3, vel: opts.vel || new THREE.Vector3(), spin: opts.spin ?? (Math.random() - .5) * 2 });
}
function updateFx(dt) {
  for (let i = fx.length - 1; i >= 0; i--) {
    const e = fx[i]; e.t += dt; const k = e.t / e.life;
    if (k >= 1) { scene.remove(e.s); e.s.material.dispose(); fx.splice(i, 1); continue; }
    e.s.scale.setScalar(e.size * (1 + (e.grow - 1) * k)); e.s.material.opacity = 1 - k * k; e.s.material.rotation += e.spin * dt;
    e.s.position.addScaledVector(e.vel, dt);
  }
}
let shake = 0;

// ---------------------------------------------------------------- tiny synth for hits (starts after the first tap)
let actx = null;
function audio() { if (!actx) try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} return actx; }
function sfx(kind) {
  const a = audio(); if (!a || a.state !== 'running') { a?.resume?.(); if (!a) return; }
  const t = a.currentTime, g = a.createGain(); g.connect(a.destination);
  if (kind === 'whoosh') {
    const b = a.createBuffer(1, a.sampleRate * .18, a.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / d.length);
    const s = a.createBufferSource(), f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(700, t); f.frequency.linearRampToValueAtTime(1800, t + .18);
    s.buffer = b; s.connect(f); f.connect(g); g.gain.value = .12; s.start(t); return;
  }
  const o = a.createOscillator(); o.type = kind === 'block' ? 'triangle' : 'sine';
  o.frequency.setValueAtTime(kind === 'block' ? 520 : kind === 'ko' ? 160 : 210, t); o.frequency.exponentialRampToValueAtTime(kind === 'block' ? 300 : 60, t + .22);
  g.gain.setValueAtTime(kind === 'ko' ? .5 : .35, t); g.gain.exponentialRampToValueAtTime(.001, t + .28); o.connect(g); o.start(t); o.stop(t + .3);
  const b = a.createBuffer(1, a.sampleRate * .07, a.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const s = a.createBufferSource(), g2 = a.createGain(); g2.gain.value = kind === 'block' ? .12 : .25; s.buffer = b; s.connect(g2); g2.connect(a.destination); s.start(t);

  g.scene.updateMatrixWorld(true);
  const rootBone = g.scene.getObjectByName('root');
  const M4 = new THREE.Matrix4().copy(g.scene.matrixWorld).invert().multiply(rootBone.parent.matrixWorld);
  ROOT_TO_MODEL = new THREE.Matrix3().setFromMatrix4(M4);
  P1 = new Fighter('aka', -1.15, 1, 0); P2 = new Fighter('ao', 1.15, -1, 1);
  ui.loading.hidden = true; show('title'); mode = 'title';
  window.__kb = { P1, P2, CLIPS, startMatch, get mode() { return mode; }, get round() { return roundState; }, setCam: m => { camMode = m; } };
  requestAnimationFrame(t => { lastT = t; frame(t); });
}
